name: VAJRA CI Pipeline

on:
  push:
    branches: [ "main", "dev", "t*-*" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-test:
    name: Lint, Test & Scenario Acceptance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vajra_user
          POSTGRES_PASSWORD: vajra_password
          POSTGRES_DB: vajra_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx python-jose[cryptography] passlib redis
          if [ -f ml/requirements.txt ]; then pip install -r ml/requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Syntax & Lint Validation
        run: |
          python -m py_compile infra/auth/jwt.py infra/auth/rbac.py infra/rate_limiting/middleware.py infra/audit/audit_middleware.py
          python -c "print('Syntax validation passed successfully.')"

      - name: Run Scenario Acceptance & Adversarial Harness (T6 Tasks 3, 7, 9)
        run: |
          python scenarios/acceptance/test_runner.py --all

      - name: Verify Docker Compose Syntax
        run: |
          docker compose -f infra/docker/docker-compose.yml config
