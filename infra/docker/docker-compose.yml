services:
  # ============================================================================
  # Relational Database (T5)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: vajra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vajra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vajra_password}
      POSTGRES_DB: ${POSTGRES_DB:-vajra_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vajra_user} -d ${POSTGRES_DB:-vajra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vajra_network

  # ============================================================================
  # Graph Database (T5 / T1 / T2 / T3)
  # ============================================================================
  neo4j:
    image: neo4j:5.18.0-community
    container_name: vajra_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-vajra_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_db_default__database: ${NEO4J_DATABASE:-sih2026}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vajra_network

  # ============================================================================
  # In-Memory Cache & Message Broker (T5 / T6)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: vajra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vajra_network

  # ============================================================================
  # Object Storage (S3 Compatible) — Evidence & Reports (T5 / T6)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: vajra_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-vajra_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-vajra_minio_secret_password}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vajra_network

  # ============================================================================
  # Backend API — FastAPI (T1 Lead)
  # ============================================================================
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: vajra_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vajra_user}:${POSTGRES_PASSWORD:-vajra_password}@postgres:5432/${POSTGRES_DB:-vajra_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vajra_neo4j_password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-sih2026}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-vajra_jwt_super_secret_signing_key_change_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      EXPLORER_API_KEY_BTC: ${EXPLORER_API_KEY_BTC:-}
      EXPLORER_API_KEY_ETH: ${EXPLORER_API_KEY_ETH:-}
      NCRP_MOCK_MODE: "true"
      MODEL_ARTIFACT_PATH: ml/artifacts
      ML_DEVICE: ${ML_DEVICE:-cpu}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vajra_network

  # ============================================================================
  # AI / ML Service (T3 Lead)
  # ============================================================================
  ml:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ml
    container_name: vajra_ml
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vajra_neo4j_password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-sih2026}
      MODEL_ARTIFACT_PATH: ml/artifacts
      ML_DEVICE: ${ML_DEVICE:-cpu}
    ports:
      - "8001:8001"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - vajra_network

  # ============================================================================
  # Frontend UX — Next.js (T4 Lead)
  # ============================================================================
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: vajra_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vajra_network

networks:
  vajra_network:
    name: vajra_network
    driver: bridge

volumes:
  postgres_data:
    name: vajra_postgres_data
  neo4j_data:
    name: vajra_neo4j_data
  neo4j_logs:
    name: vajra_neo4j_logs
  redis_data:
    name: vajra_redis_data
  minio_data:
    name: vajra_minio_data
